# Docker Compose optimizado para EasyPanel - Sistema CPS
# Puerto 3000 - Todo en un contenedor

version: '3.8'

services:
  # Aplicación CPS completa en puerto 3000
  cps-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cps-system
    restart: unless-stopped
    
    # Variables de entorno para EasyPanel
    environment:
      # Aplicación
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=https://tu-dominio.com
      - PORT=3000
      
      # Base de datos MySQL externa
      - DB_HOST=mysql-externo
      - DB_PORT=3306
      - DB_DATABASE=cps_database
      - DB_USERNAME=cps_user
      - DB_PASSWORD=cps_secure_2025
      
      # Redis externo
      - REDIS_HOST=redis-externo
      - REDIS_PORT=6379
      
      # Correo
      - MAIL_MAILER=smtp
      - MAIL_HOST=smtp.tu-proveedor.com
      - MAIL_PORT=587
      - MAIL_USERNAME=noreply@tu-dominio.com
      - MAIL_PASSWORD=tu-password-mail
      
      # Pagos (configurar según necesidades)
      - STRIPE_KEY=pk_test_tu_clave_publica
      - STRIPE_SECRET=sk_test_tu_clave_secreta
    
    # Puertos
    ports:
      - "3000:3000"
    
    # Volúmenes para persistencia
    volumes:
      - cps_storage:/var/www/storage
      - cps_logs:/var/log
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Recursos
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

volumes:
  cps_storage:
    driver: local
  cps_logs:
    driver: local

# Red (opcional - para comunicación con servicios externos)
networks:
  default:
    name: cps-network