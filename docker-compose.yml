version: '3.8'

services:
  # Aplicación PHP con ionCube
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cps_app
    volumes:
      - ./system:/var/www
      - app_storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    networks:
      - cps_network
    depends_on:
      - mysql
      - redis
    restart: unless-stopped

  # Servidor web Nginx
  web:
    image: nginx:alpine
    container_name: cps_web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./system:/var/www:ro
      - app_storage:/var/www/storage:ro
    networks:
      - cps_network
    depends_on:
      - app
    restart: unless-stopped

  # Base de datos MySQL
  mysql:
    image: mysql:8.0
    container_name: cps_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cps_secure_2024}
      MYSQL_DATABASE: ${DB_DATABASE:-cps_db}
      MYSQL_USER: ${DB_USERNAME:-cps_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cps_secure_2024}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./system/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - cps_network
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password

  # Cache Redis
  redis:
    image: redis:7-alpine
    container_name: cps_redis
    volumes:
      - redis_data:/data
    networks:
      - cps_network
    restart: unless-stopped
    command: redis-server --appendonly yes

  # Panel de administración PHPMyAdmin (opcional)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cps_phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-cps_secure_2024}
    networks:
      - cps_network
    depends_on:
      - mysql
    restart: unless-stopped
    ports:
      - "8080:80"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local

networks:
  cps_network:
    driver: bridge