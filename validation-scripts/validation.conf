# CPS Validation Configuration for Easypanel
# This file controls when and how validation scripts run

# Auto-execution settings
AUTO_VALIDATE_ON_DEPLOY=true
AUTO_VALIDATE_ON_RESTART=true
CONSOLE_OUTPUT=true
DETAILED_LOGGING=true

# Validation script selection
DEPLOY_SCRIPT="easypanel_post_deploy_check.sh"
RESTART_SCRIPT="restart_quick_check.sh"
DETAILED_SCRIPT="validate_deployment_easypanel.php"

# Log retention
LOG_RETENTION_DAYS=7
MAX_LOG_FILES=50

# Notification settings (for future use)
NOTIFY_ON_ERRORS=true
NOTIFY_EMAIL=""

# Console output formatting
USE_COLOR_CODES=true
CONSOLE_LOG_LEVEL="INFO"